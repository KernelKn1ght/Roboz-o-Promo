name: Amazon Afiliado Bot

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # PASSO CRUCIAL: Instala o Chromium + Bibliotecas de Sistema do Linux (libgbm, nss, etc)
      - name: Install Playwright Chromium & Deps
        run: npx playwright install --with-deps chromium

      # CORREÇÃO DO CACHE: Garantir que o diretório exista antes do restore/save
      - name: Create data directory
        run: mkdir -p data

      - name: Restore sent offers state cache
        uses: actions/cache/restore@v4
        with:
          path: data/offers-state.json
          key: sent-offers-${{ github.repository }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            sent-offers-${{ github.repository }}-${{ github.ref_name }}-

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          AMAZON_AFILIADO_TAG: ${{ secrets.AMAZON_AFILIADO_TAG }}
          # Suas outras variáveis de ambiente...
          SENT_STATE_FILE: "data/offers-state.json"
        run: node src/index.js

      # SALVAR CACHE: Só vai funcionar agora porque a pasta data/ existe
      - name: Save sent offers state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/offers-state.json
          key: sent-offers-${{ github.repository }}-${{ github.ref_name }}-${{ github.run_id }}